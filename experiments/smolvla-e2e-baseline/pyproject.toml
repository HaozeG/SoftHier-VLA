[project]
name = "smolvla-e2e-baseline-env"
version = "0.1.0"
description = "Python environment of the SmolVLA-on-SoftHier experiment: softhier-mlir, host prepare steps, GVSoC runtime (not a package)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # softhier-mlir itself (editable); it names xdsl>=0.69
    "softhier-mlir",
    "xdsl>=0.69",
    "numpy",
    # host prepare steps (smolvla.py / smolvla_expert.py / smolvla_e2e.py): HF SigLIP and Llama references
    "torch",
    "transformers",
    "safetensors",
    "huggingface_hub",
    # GVSoC Python requirements (copied from infra/softhier/pyproject.toml), because
    # run.sh activates this environment and gapy runs with the active python3
    "tabulate",
    "beautifulsoup4>=4.11.1",
    "hjson>=3.1.0",
    "html2text>=2020.1.16",
    "Mako>=1.1.3",
    "marko>=2.0.3",
    "matplotlib>=3.8.2",
    "mistune>=3.0.2",
    "pandas>=2.2.2",
    "pexpect>=4.9.0",
    "prettytable>=0.7.2",
    "pyelftools>=0.29",
    "pytablewriter>=1.2.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.1",
    "setuptools>=59.6.0,<81",  # GVSoC reggen imports pkg_resources, removed in setuptools 81
    "six>=1.16.0",
    "jsonref",
    "tqdm",
    # tests
    "filecheck",
    "lit",
    "pytest",
]

[tool.uv]
package = false

[tool.uv.sources]
softhier-mlir = { path = "softhier-mlir", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
