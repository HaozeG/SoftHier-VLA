# Hand-written kernels simulated alone at one operator instance of the workload (ns per call).
# Repo: HaozeG/gvsoc implementation/ (branch gelu-layernorm-kernels, base softhier_deeploy 52859c3; 580ac85 for
# LayerNorm, Activation and RMSNorm, dc749bc for Eltwise, SummaGEMM and FlatAttention), arch stage1
# (implementation/config/arch/arch.py), DRAMSys HBM, built out of tree against ~/softhier's install.
# LayerNorm, Activation and Eltwise outputs are checked on the device against a replay golden. RMSNorm,
# SummaGEMM and FlatAttention run the upstream preload (placeholder data): timing only.
# SummaGEMM pads M, N, K up to 4 x tile; FlatAttention pads sequence lengths up to a block multiple and has no
# masking. Their tile and block settings are the fastest of a sweep per shape (source: the chosen setting).
# Key: <stage>.<kernel>_<operator row shape>; map from operators: smolvla_ops.hand_kernel_key.
# Per-call times move by about 3 % with code placement alone (GELU 68.1 vs 70.5 us, same loop, 12-byte offset).
hand_kernels:
  vision:
    layernorm_1024x768:
      {value: 21250, unit: ns, label: measured, workload: libero-2cam, arch: stage1, source: "HaozeG/gvsoc@580ac85 lnorm m=1024 n=768 eps=1e-6", note: "bit-exact against the replay on all 16 clusters; the ISS leaves vfwadd.wv, vfwsub.vf, vmv.x.s, vmv.s.x, vmv.v.i untimed (optimistic)"}
    gelu_1024x3072:
      {value: 70519, unit: ns, label: measured, workload: libero-2cam, arch: stage1, source: "HaozeG/gvsoc@580ac85 acti algo=gelu m=1024 n=3072", note: "bit-exact against the replay on all 16 clusters"}
    gemm_1024x3072x768:
      {value: 323923, unit: "ns", label: "measured", workload: "libero-2cam", arch: "stage1", source: "HaozeG/gvsoc@dc749bc gemm m=1024 n=3072 k=768 tile=256/128/128 scale=4x4", note: "fastest of 63 tile settings (323,923 to 5,113,014 ns); padded to 1024x3072x768 (1.00x nominal work); timing only, output not checked; ops: vision mlp_up"}
    gemm_1024x768x3072:
