    gemm_1024x768x768:
      {value: 88879, unit: "ns", label: "measured", workload: "libero-2cam", arch: "stage1", source: "HaozeG/gvsoc@dc749bc gemm m=1024 n=768 k=768 tile=256/64/128 scale=4x4", note: "fastest of 62 tile settings (88,879 to 1,351,364 ns); padded to 1024x768x768 (1.00x nominal work); timing only, output not checked; ops: vision patch_embed, q/k/v/o_proj"}
