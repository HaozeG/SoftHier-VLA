[project]
name = "workload-modeling"
version = "0.1.0"
description = "Standalone analytical model of VLA workloads (SmolVLA first) and the stage-1 constants for SoftHier-VLA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
    "huggingface_hub",  # fixtures refresh only; the build reads committed fixtures
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workload_modeling"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
